# Include in the existing Nginx http block. Point the public hostnames at Nginx
# and use your existing wildcard certificate and key.
map $http_upgrade $self_hosted_relay_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name *.relay.example.net;
    ssl_certificate     /etc/nginx/certs/relay.example.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/relay.example.net/privkey.pem;

    # Nginx can include the full request URI in both access and error logs.
    access_log off;
    error_log /dev/null;

    location / {
        # For a bridge-networked Nginx container, join both containers to the
        # same Docker network and use http://relay:8080 here.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $self_hosted_relay_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
